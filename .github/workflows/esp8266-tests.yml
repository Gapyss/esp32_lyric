# The ESP8266 daemon (and lyrics_search) must run on both macOS and Windows.
name: esp8266 tests

on:
  push:
    paths: ["esp8266/**", ".github/workflows/esp8266-tests.yml"]
  pull_request:
    paths: ["esp8266/**", ".github/workflows/esp8266-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Pillow renderer is what Windows uses; install it on both so its tests run too.
      - run: python -m pip install -r esp8266/daemon/requirements-windows.txt
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s esp8266/tests -t . -v 2>&1 | tee test.log
      # Surface each failing test as an annotation, readable without downloading the log.
      - name: Report failures
        if: failure()
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import re
          log = open("test.log", encoding="utf-8", errors="replace").read()
          for block in re.split(r"\n={50,}\n", log)[1:11]:
              lines = block.strip().splitlines()
              msg = "%0A".join(line.replace("::", ": :") for line in lines[:30])
              print(f"::error title={lines[0][:120]}::{msg}")
          if "Ran " not in log:
              print("::error title=unittest did not finish::" + "%0A".join(log.splitlines()[-30:]))
          PY
      - name: lyrics_search CLI prints Thai to a redirected log
        shell: bash
        env:
          PYTHONIOENCODING: ${{ matrix.os == 'windows-latest' && 'cp1252' || 'utf-8' }}
        run: |
          python -c "import sys; sys.path.insert(0, 'esp8266/daemon'); import lyrics_search as m; print(m.parse_title('ทางของฝุ่น [Official MV]').clean)"
          python esp8266/daemon/lyrics_search.py "" "" > cli.log 2>&1 || true
          cat cli.log
